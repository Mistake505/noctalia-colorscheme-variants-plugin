id           = "uozzoku/colorscheme_variants" # "<author>/<plugin>" - globally unique
name         = "Colorscheme Variants"
version      = "1.0.0"
plugin_api   = 3          # mandatory: oldest plugin API level required
author       = "UozzokU"
license      = "MIT"     # optional; defaults to MIT
deprecated   = false     # optional; defaults to false
icon         = "palette"  # optional
description  = "Colorscheme Variants"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 920
height = 780
placement = "attached"
position = "auto"

[[widget]]
id = "colorscheme_variants"
entry = "colorscheme_variants.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "palette"


# Control-center quick-toggle tile. Add it from Settings → Control Center shortcuts.
[[shortcut]]
id = "colorscheme_variants"
entry = "shortcut.luau"