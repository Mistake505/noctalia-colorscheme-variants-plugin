id           = "uozzoku/colorscheme_variants" # "<author>/<plugin>" - globally unique
name         = "Colorscheme Variants"
version      = "1.0.0"
plugin_api   = 3          # mandatory: oldest plugin API level required
author       = "UozzokU"
license      = "MIT"     # optional; defaults to MIT
deprecated   = false     # optional; defaults to false
icon         = "palette"  # optional
description  = "Colorscheme Variants"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 500
height = 415
placement = "attached"
position = "auto"

[[widget]]
id = "colorscheme_variants_widget"
entry = "colorscheme_variants_widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "palette"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = ""
